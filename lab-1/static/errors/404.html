<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена</title>
  <style>
    :root { color-scheme: light; --background: #EDF3FA; --surface: #FFF; --text: #182C49; --action: #245DB5; --border: #D2DEEB; --error: #A83932; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; align-content: center; background: var(--background); color: var(--text); font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 16px; line-height: 1.65; }
    main { width: min(920px, calc(100% - 56px)); margin: 48px auto; padding: 48px; display: grid; grid-template-columns: auto 1fr; gap: 40px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
    .status { margin: 0; color: var(--error); font-size: clamp(88px, 15vw, 152px); font-weight: 650; line-height: 1; letter-spacing: -.075em; }
    h1 { margin: 0 0 18px; font-size: clamp(32px, 4vw, 40px); font-weight: 650; line-height: 1.18; letter-spacing: -.04em; }
    .explanation { max-width: 420px; margin: 0 0 28px; color: rgb(24 44 73 / .75); }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 20px; border-radius: 9px; background: var(--action); color: var(--surface); font-weight: 600; text-decoration: none; }
    a:hover { background: #1E509D; }
    a:focus-visible { outline: 3px solid var(--action); outline-offset: 5px; }
    @media (max-width: 720px) { main { width: calc(100% - 32px); margin: 28px auto; padding: 32px 24px; grid-template-columns: 1fr; gap: 28px; border-radius: 14px; } .status { font-size: 104px; } }
  </style>
</head>
<body>
  <main id="lab1-not-found">
    <p class="status" aria-hidden="true">404</p>
    <div>
      <h1>Страница не найдена</h1>
      <p class="explanation">Проверьте адрес в строке браузера или откройте главную страницу этого сайта.</p>
      <a href="/">На главную</a>
    </div>
  </main>
</body>
</html>
