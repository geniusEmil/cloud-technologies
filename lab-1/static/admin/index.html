<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>По делу. Доступ</title>
  <style>
    :root { color-scheme: light; --background: #EDF3FA; --surface: #FFF; --text: #182C49; --action: #245DB5; --border: #D2DEEB; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); font-family: "Avenir Next", "Segoe UI", sans-serif; font-size: 16px; line-height: 1.65; }
    a { color: var(--action); text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid var(--action); outline-offset: 5px; border-radius: 4px; }
    .site-header { max-width: 1120px; margin: 0 auto; padding: 28px 0; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--border); }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: -.035em; white-space: nowrap; }
    .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--action); display: grid; place-items: center; }
    .brand-mark svg { width: 20px; height: 20px; }
    nav { display: flex; align-items: center; gap: 28px; }
    nav a { color: var(--text); font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 0; }
    nav a:hover { color: var(--action); }
    nav a[aria-current="page"] { color: var(--action); box-shadow: 0 2px var(--action); }
    main { max-width: 760px; margin: 72px auto; padding: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
    .access-icon { display: block; width: 48px; height: 48px; margin-bottom: 28px; color: var(--action); }
    h1 { margin: 0 0 18px; font-size: clamp(32px, 4vw, 40px); font-weight: 650; letter-spacing: -.04em; line-height: 1.18; }
    p { max-width: 510px; margin: 0; font-size: 18px; color: rgb(24 44 73 / .75); }
    .links { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--border); }
    .primary-link { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 20px; border-radius: 9px; background: var(--action); color: var(--surface); font-weight: 600; text-decoration: none; }
    .primary-link:hover { background: #1E509D; }
    .help-link { font-weight: 600; }
    @media (max-width: 1180px) { .site-header { margin: 0 28px; } }
    @media (max-width: 820px) { main { margin: 48px 28px; } }
    @media (max-width: 640px) { .site-header { margin: 0 20px; padding: 20px 0; flex-wrap: wrap; gap: 18px; } nav { width: 100%; gap: 28px; } main { margin: 28px 16px 40px; padding: 28px 24px; border-radius: 14px; } p { font-size: 16px; } .access-icon { margin-bottom: 24px; } .links { margin-top: 28px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="По делу, список задач">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M5 5h10M5 10h10M5 15h7" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></span>
      По делу
    </a>
    <nav aria-label="Основная навигация">
      <a href="/">Задачи</a>
      <a href="/docs/">Помощь</a>
      <a href="/admin" aria-current="page">Доступ</a>
    </nav>
  </header>
  <main>
    <svg class="access-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="10" y="20" width="28" height="23" rx="6" stroke="currentColor" stroke-width="2.5"/><path d="M16 20v-6a8 8 0 0 1 16 0v6M19 31l4 4 7-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Вход выполнен</h1>
    <p>Пароль проверен, доступ к защищённой странице открыт.</p>
    <div class="links">
      <a class="primary-link" href="/">Вернуться к задачам</a>
      <a class="help-link" href="/docs/">Помощь</a>
    </div>
  </main>
</body>
</html>
